[build-system]
# >=77 for PEP 639 license metadata (`license` as an SPDX string, `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2t"
version = "0.1.0"
description = "Convert EU legislative amendment proposals into tracked-changes Word documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "python-docx>=1.2.0",   # 1.2 adds Document.add_comment
    "eurlex-builder==0.1.1", # pinned: we depend on its parquet output schema
    # eurlex-builder exports through `connection.pl()`, which DuckDB 2.0 removed, and
    # declares no upper bound of its own — so a fresh install took 2.x and every
    # retrieval failed at "Exporting results". Ours until the library pins it.
    "duckdb>=1.0,<2",
    "pyyaml>=6.0",          # retrieval/eurlex_builder.py writes the library's config
    "polars>=1.0",
    "lxml>=5.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "flask>=3.0"]
web = ["flask>=3.0"]

[project.scripts]
a2t = "a2t.cli:main"
a2t-web = "a2t_web.app:main"
a2t-web-users = "a2t_web.users:main"

[tool.setuptools.packages.find]
include = ["a2t*"]

[tool.setuptools.package-data]
a2t_web = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
